<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Villagesquare Meet</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/favicon.png">
<meta name="description" content="Instant, secure video meetings by VillageSquare. Start a meeting and share one link — anyone can join with just their name.">
<meta name="theme-color" content="#202124">
<!-- Open Graph (relative image resolves against the page URL on any domain) -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="VillageSquare Meet">
<meta property="og:title" content="VillageSquare Meet">
<meta property="og:description" content="Instant, secure video meetings. Start a meeting and share one link — anyone can join with just their name.">
<meta property="og:image" content="og.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="VillageSquare Meet">
<!-- Twitter / X -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="VillageSquare Meet">
<meta name="twitter:description" content="Instant, secure video meetings. Start a meeting and share one link — anyone can join with just their name.">
<meta name="twitter:image" content="og.png">
<meta name="twitter:image:alt" content="VillageSquare Meet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<script>
/* Set the theme before first paint so a dark-mode user never sees a light flash. */
(function(){try{var t=localStorage.getItem('vsm_theme');if(!t)t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
